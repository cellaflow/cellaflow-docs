<svg width="250" height="28" viewBox="0 0 250 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chevronGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A8CC" />
      <stop offset="100%" stop-color="#0CE39A" />
    </linearGradient>
  </defs>

  <!-- Left & Right Chevrons (fills 26px height) -->
  <g transform="translate(0, 1) scale(0.125)">
    <path d="M 48,48 L 128,128 L 48,208" 
          stroke="#042F4B" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 128,48 L 208,128 L 128,208" 
          stroke="url(#chevronGradLight)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Brand Title: Cella + flow -->
  <text x="34" y="17" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    Cella<tspan fill="#2563EB">flow</tspan>
  </text>

  <!-- Sub-label: EXECUTION LEDGER -->
  <text x="35" y="26.5" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.14em" fill="#0D9488">
    EXECUTION LEDGER
  </text>
</svg>
